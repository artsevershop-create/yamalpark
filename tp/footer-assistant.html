<!-- 22 · Помощник: отвечает на вопросы (база — все FAQ сайта, см. assistant-kb.js), показывает погоду и шанс сияния,
     проверяет свободные даты (YP.freeDays) и передаёт заявку в систему бронирования: проживание — TravelLine с выбранной датой,
     бани, гриль- и гостевые дома, чум, шатёр и зал — HotBot на нужной услуге (YP.bookUnit). Без сервера и ключей.
     Подключается вместе с подвалом на всех страницах. Только русская версия. -->
<style>
.yp-as{--as-bg:#fff;--as-ink:#14181d;--as-mut:#5d6a66;--as-line:rgba(20,24,29,.1);font-family:var(--yp-f,system-ui,sans-serif)}
.yp-as[hidden]{display:none!important}
.yp-as__btn{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 62px);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:9983;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 8px;border:0;border-radius:999px;cursor:pointer;background:var(--as-ink);color:#fff;font:600 15px/1 var(--yp-f,system-ui,sans-serif);box-shadow:0 14px 30px -12px rgba(0,0,0,.55);transition:transform .3s,background .3s,bottom .35s}
.yp-as__btn:hover{transform:translateY(-2px);background:#000}
.yp-as__btn i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#5CFFC0,#6274B6);color:#0b1320;flex:0 0 auto}
.yp-as__btn i svg{width:20px;height:20px}
.yp-as__btn b{font-weight:600}
.yp-as__btn .dot{position:absolute;left:36px;top:6px;width:10px;height:10px;border-radius:50%;background:#3FAB3C;box-shadow:0 0 0 2px var(--as-ink)}
html.yp-as-open .yp-as__btn{opacity:0;pointer-events:none}
.yp-as__panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:10010;width:min(400px,calc(100vw - 32px));height:min(620px,calc(100vh - 110px));display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:#f3f4f1;color:var(--as-ink);box-shadow:0 30px 70px -20px rgba(0,0,0,.45),0 0 0 1px var(--as-line);transform-origin:20% 100%;animation:ypAsIn .32s cubic-bezier(.2,.9,.3,1.2)}
.yp-as__panel[hidden]{display:none}
@keyframes ypAsIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.yp-as__head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;background:#0b1320;color:#fff}
.yp-as__head i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#5CFFC0,#6274B6);color:#0b1320;flex:0 0 auto}
.yp-as__head i svg{width:22px;height:22px}
.yp-as__head div{flex:1;min-width:0}
.yp-as__head b{display:block;font:600 16px/1.2 var(--yp-f,system-ui,sans-serif)}
.yp-as__head small{display:block;margin-top:2px;font-size:12.5px;color:#a9c4bc}
.yp-as__x{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.yp-as__x:hover{background:rgba(255,255,255,.2)}
.yp-as__log{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;scrollbar-width:thin}
.yp-as__m{max-width:88%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere}
.yp-as__m--bot{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 1px 0 var(--as-line)}
.yp-as__m--me{align-self:flex-end;background:#0b1320;color:#fff;border-bottom-right-radius:6px}
.yp-as__m a{color:#2f5fae;text-decoration:underline;text-underline-offset:2px}
.yp-as__m b{font-weight:600}
.yp-as__m small{display:block;margin-top:6px;color:var(--as-mut);font-size:12.5px}
.yp-as__days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.yp-as__typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border-radius:18px;background:#fff}
.yp-as__typing span{width:7px;height:7px;border-radius:50%;background:#9aa6a2;animation:ypAsDot 1s infinite}
.yp-as__typing span:nth-child(2){animation-delay:.15s}.yp-as__typing span:nth-child(3){animation-delay:.3s}
@keyframes ypAsDot{50%{opacity:.25;transform:translateY(-3px)}}
.yp-as__chips{display:flex;gap:6px;padding:4px 14px 10px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.yp-as__chips::-webkit-scrollbar{display:none}
.yp-as__chips:empty{display:none}
.yp-as__c{flex:0 0 auto;border:0;border-radius:999px;padding:9px 13px;background:#fff;color:var(--as-ink);font:500 13.5px/1.1 var(--yp-f,system-ui,sans-serif);cursor:pointer;box-shadow:inset 0 0 0 1px var(--as-line);white-space:nowrap;transition:background .2s}
.yp-as__c:hover{background:#e7ecea}
.yp-as__c--go{background:#2E8C2C;color:#fff;box-shadow:none}
.yp-as__c--go:hover{background:#25762a}
.yp-as__m .yp-as__c{white-space:normal;text-align:left}
.yp-as__form{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--as-line)}
.yp-as__form input{flex:1;min-width:0;height:44px;border:0;border-radius:999px;padding:0 16px;background:#f1f3f2;color:var(--as-ink);font:16px var(--yp-f,system-ui,sans-serif);outline:none}
.yp-as__form input:focus{box-shadow:0 0 0 2px #6274B6}
.yp-as__form button{width:44px;height:44px;border:0;border-radius:50%;background:#0b1320;color:#fff;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.yp-as__form button svg{width:18px;height:18px}
.yp-as__note{margin:0;padding:0 14px 10px;background:#fff;font-size:11.5px;color:var(--as-mut)}
.yp-as__date{display:flex;gap:6px;align-items:center;margin-top:8px}
.yp-as__date input{height:38px;border:1px solid var(--as-line);border-radius:10px;padding:0 8px;font:15px var(--yp-f,system-ui,sans-serif)}
@media (max-width:768px){
  .yp-as__btn{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));height:48px;padding:0 5px;width:48px;justify-content:center}
  .yp-as__btn b{display:none}
  .yp-as__btn .dot{left:32px;top:4px}
  html.yp-act-on .yp-as__btn{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .yp-as__panel{left:0;right:0;bottom:0;top:0;width:auto;height:auto;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html.yp-as-open,html.yp-as-open body{overflow:hidden}
  html.yp-as-open [class*="hotbot-widget"],html.yp-as-open .yp-act{opacity:0!important;pointer-events:none!important}
}
@media (prefers-reduced-motion:reduce){.yp-as__panel{animation:none}.yp-as__typing span{animation:none}}
@media print{.yp-as{display:none!important}}
</style>

<script>
(function(){
  var YP = window.YP || {}, root = document.getElementById("yp-as"); if(!root) return;
  if(YP.lang && YP.lang !== "ru") return;                    /* только русская версия: ответы на русском */
  var KB = /*KB*/[{"q":"Есть ли другие скидки?","k":"скидка годовщина свадьбы первое посещение новым клиентам сво участникам лояльность акция","a":"Других скидок нет — только 25% ко дню рождения (неделя до и после, на один объект)."},{"q":"Есть ли мангал у домиков?","k":"мангал мангальная зона шашлык гриль купол волк медведь шампуры решетка розжиг уголь","a":"Да. У купольного домика мангал стоит на террасе, у домов «Волк» и «Медведь» — мангальные зоны. Даём шампуры, решётку и розжиг, уголь — ваш. У бань мангальных зон нет."},{"q":"Что дают в гриль-доме и гостевом доме?","k":"посуда бокалы тарелки одноразовая гриль гостевой шампуры телевизор вайфай караоке чайник","a":"В гриль-доме: одноразовая посуда, салфетки, вода, шампуры и розжиг, есть чайник, микроволновка, телевизор и Wi-Fi. В гостевом доме сервируем стеклянной посудой на заявленное количество гостей (тарелка, приборы, бокал), рюмки и бокалы под вино — ваши. Караоке нет."},{"q":"Как проходит заселение?","k":"заселение процесс регистрация договор паспорт ресепшен администрация куда подъехать парковка ключи","a":"Сначала зайдите на ресепшен — одноэтажное здание «Ямал Парк Администрация» на въезде: регистрация и договор аренды, нужен паспорт. Потом администратор проводит до домика. Парковка есть у каждого домика."},{"q":"Можно заехать позже или выехать позже?","k":"поздний заезд приехать вечером ночью поздно часа ночи позже выезд продлить продление ранний","a":"Заехать можно в любое время после начала заезда (купол — с 14:00, «Волк» и «Медведь» — с 15:00), администратор работает до 22:00. Поздний выезд возможен, если на следующий день домик не забронирован, продление — 1 000 ₽ в час."},{"q":"Сколько человек помещается в «Волке» и «Медведе»?","k":"сколько человек вместимость волк медведь компания гостей спальных мест","a":"До 4 человек: двуспальная кровать в спальне и раскладной диван в гостиной, стол на 4 места. Для компании больше берите гриль-дом (15–20 гостей) или гостевой дом (20–25 гостей) на день."},{"q":"Можно ли кормить животных в мини-зоопарке?","k":"кормить животных угостить покормить погладить гладить трогать кролики козы рыси лисы","a":"Рысей и лис кормить нельзя. Кроликов и коз можно угостить свежими овощами — капустой, огурцами, морковью."},{"q":"Можно просто приехать погулять?","k":"погулять прогулка территория вход платный посмотреть животных","a":"Да, вход на территорию и в мини-зоопарк бесплатный."},{"q":"Есть ли пейнтбол и лазертаг?","k":"пейнтбол лазертаг квест игра","a":"Пейнтбол и лазертаг проводит отдельный организатор на нашей территории. Контакты подскажет администратор: +7 900 399-10-33. А домик для компании после игры можно забронировать у нас."},{"q":"Есть ли комары и гнус?","k":"гнус комары мошка насекомые обработка","a":"Территорию обрабатываем, но полностью от гнуса это не спасает — летом возьмите репеллент."},{"q":"Когда вернут деньги при отмене?","k":"возврат денег отмена брони вернут сколько ждать","a":"При отмене за 3 дня и раньше возвращаем 100%, деньги приходят обычно за 3–10 рабочих дней. Отменить бронь можно у администратора: +7 900 399-10-33 или в сообщениях ВК."},{"q":"Можно снять домик на несколько часов или для фотосессии?","k":"почасово на несколько часов фотосессия фото часы","a":"Домики для проживания сдаются посуточно, почасовой аренды нет. Для фотосессий в пятницу–воскресенье и праздники они не сдаются. На день можно снять гриль-дом, гостевой дом или беседку — с 12:00 до 22:00."},{"q":"Можно украсить домик к празднику?","k":"украсить украсим шарики украшения годовщина сюрприз оформление предложение руки сердца романтик","a":"Да, украсить домик можно самостоятельно после заезда. Оформление праздника мы не делаем."},{"q":"Сколько стоит продление?","k":"продление после 22 после 23 час доплата","a":"Беседка после 22:00 — 2 000 ₽ в час, шатёр «Сияние севера» и банкетный зал после 23:00 — 3 000 ₽ в час, баня после 23:00 — 7 000 ₽ в час, домики в день выезда — 1 000 ₽ в час."},{"q":"Что входит в аренду банкетного зала?","k":"банкетный зал шатер свадьба что входит столы стулья посуда оформление декор","a":"Столы, стулья и посуда для сервировки, аренда на весь день с 12:00 до 23:00. Оформление и декор — ваши. Меню можно заказать у ресторана-партнёра, контакты даст администратор."},{"q":"Это гостиница? Где остановиться в Салехарде?","k":"гостиница отель номер переночевать остановиться где остановиться командировка хостел","a":"Ямал Парк — загородная база отдыха с отдельными домиками в 16 минутах от Салехарда: купольный домик и дома с террасой «Волк» и «Медведь» на 2–4 гостей, у каждого свой санузел, мангал и парковка. Проживание от 8 000 ₽ за сутки. Ресторана и обслуживания номеров нет — продукты можно привозить."},{"q":"Когда работает администратор?","k":"администратор режим работы до скольки отвечаете часы связи","a":"Администратор на связи ежедневно с 10:00 до 22:00: +7 900 399-10-33. Онлайн-бронь на сайте работает круглосуточно."},{"q":"Как забронировать?","a":"Проживание бронируется на сайте с мгновенным подтверждением. Бани, гриль-дома, беседку, чум, шатёр и банкетный зал можно записать онлайн по времени. Если удобнее, позвоните по номеру +7 900 399-10-33 или напишите в VK, Telegram (@yamalpark) или Max. После заявки пришлём подтверждение и реквизиты для предоплаты.","k":"как забронировать бронирование оформить бронь записаться"},{"q":"Как узнать, есть ли свободные даты?","a":"Свободные даты и цены на сайте берутся прямо из систем бронирования: на страницах «Глэмпинг», «Бани» и «Гриль-дома» есть календарь. Если нужной даты нет, позвоните администратору: +7 900 399-10-33.","k":""},{"q":"Какие условия отмены?","a":"Отмена менее чем за 3 дня или неявка: предоплата не возвращается. Полные условия есть в разделе «Документы».","k":"отмена вернуть деньги возврат перенос перенести дату заболеем не сможем приехать форс мажор"},{"q":"Можно ли оформить бронь на организацию?","a":"Да. Для организаций оформляем договор и предоплату. Подробности согласует администратор: +7 900 399-10-33.","k":"организация организации юрлицо счет счету безнал договор командировка закрывающие документы"},{"q":"Чем можно оплатить?","a":"Картой или через СБП.","k":"оплата карта сбп наличные"},{"q":"Есть ли скидка в день рождения?","a":"Да, 25% — за неделю до и неделю после дня рождения, на один объект (домик или баню), нужен паспорт именинника. Скидка оформляется <b>только через администратора</b>: +7 900 399-10-33 — при онлайн-бронировании на сайте она не применяется. С 15 декабря по 10 января скидки не действуют, скидки не суммируются.","k":""},{"q":"Можно ли с домашними животными?","a":"Можно с небольшими домашними питомцами — заранее согласуйте с администратором: +7 900 399-10-33.","k":"домашние собака кошка питомец пес"},{"q":"Можно ли привозить свои продукты и напитки?","a":"Да, свои продукты и напитки можно привозить.","k":"мясом углем уголь своим своими еда продукты алкоголь напитки свои пиво вино пить спиртное шампанское доставка еды заказать еду мясо"},{"q":"Где можно курить?","a":"Курить можно на улице возле урн.","k":"курить курение сигареты кальян вейп"},{"q":"Работает ли комплекс зимой?","a":"Да, Ямал Парк работает круглый год.","k":""},{"q":"Какие варианты проживания есть?","a":"Купольный домик (30 м², 2–4 гостя) и два дома с террасой: «Волк» и «Медведь» (по 50 м², 2–4 гостя). В «Волке» и «Медведе» есть кухня, душ, спальня с кроватью 160×200 и раскладной диван.","k":""},{"q":"Во сколько заезд и выезд?","a":"Купол: заезд с 14:00, выезд до 12:00 следующего дня. «Волк» и «Медведь»: заезд с 15:00, выезд до 13:00. Ранний заезд и поздний выезд возможны по договорённости, если объект свободен. Продление в день выезда: 1 000 ₽ в час.","k":"заезд выезд чекин время"},{"q":"Сколько стоит проживание?","a":"Купольный домик: 9 000 ₽ за сутки с воскресенья по четверг и 13 000 ₽ в пятницу и субботу. Дома «Волк» и «Медведь»: 8 000 ₽ с понедельника по четверг и 12 000 ₽ с пятницы по воскресенье. С 15 декабря по 10 января действуют новогодние цены: купол 13 000 ₽, «Волк» и «Медведь» 15 000 ₽ за ночь.","k":"цена ночь сутки купол волк медведь проживание домик"},{"q":"Не холодно ли зимой?","a":"Нет. В домиках тёплые полы, комфортно даже при −40 °C.","k":""},{"q":"Есть ли Wi-Fi?","a":"Да, бесплатный Wi-Fi работает в большинстве домиков, банях и на основной территории. В отдалённых точках сигнал может быть слабее.","k":"интернет вайфай wifi"},{"q":"Можно ли с детьми?","a":"Да. На территории есть детская площадка и мини-зоопарк. Детям до 5 лет проживание и баня бесплатны.","k":"дети ребенок детьми платят бесплатно возраст"},{"q":"Можно ли пожарить мясо у дома?","a":"Да, у домов «Волк» и «Медведь» есть мангальная зона, она бесплатная.","k":""},{"q":"Какое минимальное время аренды бани?","a":"Три часа. Бани работают с 10–11 до 23:00, продление после 23:00 стоит 7 000 ₽ в час.","k":""},{"q":"Сколько стоит баня?","a":"Цена за час: в понедельник–среду до 14:00 — 2 500 ₽, после 14:00 — 3 500 ₽. С четверга по воскресенье — 5 000 ₽, «Черника» — 4 000 ₽. С 15 декабря по 10 января: «Морошка» и «Брусника» 6 000 ₽ в час, «Черника» 5 000 ₽.","k":"цена час баня морошка брусника черника"},{"q":"Сколько человек помещается в баню?","a":"«Морошка» и «Брусника» — до 10 гостей, «Черника» — до 8.","k":""},{"q":"Что входит в стоимость?","a":"Парная, термопот, посуда, телевизор, Wi-Fi, холодильник, посудомоечная машина, санузел, душ и раздевалка. Полотенца, простыни, халаты, веники, напитки, закуски и PS5 заказываются отдельно.","k":""},{"q":"Сколько стоят допы?","a":"Аренда полотенец — 400 ₽, простыней — 300 ₽, халата — 1 000 ₽. Веник дубовый или берёзовый — 600 ₽, пучок мяты или полыни — 175 ₽, донника — 150 ₽. Банная шапка — 400 ₽, тапочки — 650 ₽. PlayStation 5 — 3 000 ₽. Напитки: Coca-Cola 0,33 л — 300 ₽, Borjomi 0,5 л — 220 ₽, Evian 0,5 л — 185 ₽.","k":"полотенце полотенца веник веники халат тапочки простыни шапка playstation ps5 допы дополнительно аренда"},{"q":"Как работает Алиса в бане?","a":"В парных «Морошки» и «Брусники» скажите «Алиса, включи дождь», «вьюгу», «музыку» или «свет». В «Бруснике» есть ещё туман. В фито-сауне «Морошки»: фито, туман, музыка, вьюга и ветер. «Вьюга» — подача пара на каменку. В «Чернике» Алисы нет: дождь и ветер включаются кнопками на панели.","k":""},{"q":"Чем отличаются бани?","a":"«Морошка»: парная и аромасауна. «Брусника»: парная и хаммам. «Черника»: баня на дровах с живым жаром.","k":""},{"q":"На сколько бронируется гриль-дом?","a":"На весь день: с 12:00 до 22:00. Минимальный заказ — весь день.","k":""},{"q":"Сколько стоят гриль-дома и гостевые дома?","a":"Гриль-дом №1: 6 000 ₽ (вс–чт) и 8 000 ₽ (пт, сб, праздники). Гриль-дома №2 и №3: 8 000 ₽ и 10 000 ₽. Гостевые дома №1 и №2: 8 000 ₽ и 12 000 ₽. С 15 декабря по 10 января: гриль-дом №1 — 10 000 ₽, №2 и №3 — 12 000 ₽, гостевые дома — 15 000 ₽.","k":""},{"q":"Сколько человек помещается?","a":"Гриль-дома — 15–20 гостей, гостевые дома — 20–25. Для больших компаний есть банкетный зал на 100–150 человек.","k":""},{"q":"Что есть внутри?","a":"В гриль-домах: гриль-установка, лавки и столешница вокруг гриля, телевизор, микроволновка, умывальник. В гостевых домах: стол и 4 лавки, телевизор, микроволновка, холодильник, умывальник и шкаф. Гриль-зона у гостевых домов в отдельном здании рядом.","k":""},{"q":"Что такое летняя беседка?","a":"Беседка на территории комплекса для компании до 15 гостей. Аренда с 12:00 до 22:00, 6 000 ₽ за день. В стоимость входят одноразовая посуда, розжиг и решётка.","k":""},{"q":"Сколько стоит аренда чума?","a":"12 000 ₽ с понедельника по четверг и 15 000 ₽ с пятницы по воскресенье. В стоимость входят обогретый чум, терраса, костровище, казан и мангальная зона. Чум рассчитан на 15–20 гостей и работает круглый год.","k":""},{"q":"Сколько стоит шатёр «Сияние севера»?","a":"10 000 ₽ в будни и воскресенье, 15 000 ₽ в пятницу, субботу и праздники. Шатёр 40 м² с панорамным окном и дровяной печью, до 20 гостей, весь день с 12:00 до 23:00. После 23:00 каждый час стоит 3 000 ₽.","k":""},{"q":"Сколько стоит банкетный зал?","a":"50 000 ₽ с понедельника по четверг и в воскресенье, 70 000 ₽ в пятницу, субботу, праздники и с 15 декабря по 10 января. Аренда на весь день, с 12:00 до 23:00. Зал рассчитан на 100–150 гостей.","k":""},{"q":"Можно ли заказать меню и программу?","a":"Банкетное меню и программу обсудите с администратором: +7 900 399-10-33. Он подберёт площадку под ваш праздник.","k":"ведущий диджей музыка аппаратура звук аниматор программа меню"},{"q":"Можно ли провести корпоратив?","a":"Да. Для компаний есть банкетный зал, шатёр, гриль-дома, гостевые дома и чум, а после праздника можно продолжить вечер в бане. Примеры праздника с расчётом смотрите на странице «Корпоративы».","k":""},{"q":"Есть ли подарочные сертификаты?","a":"Да, сертификаты на сумму 10 000, 15 000, 30 000 и 50 000 ₽. Купить можно на комплексе, ежедневно с 10:00 до 22:00. Онлайн-продажи и доставки нет. Получатель сам выберет дату и объект.","k":"подарок сертификат подарить сумма номинал какие бывают"},{"q":"Как оформить сертификат?","a":"Сертификат продаётся на комплексе, ежедневно с 10:00 до 22:00. Онлайн-продажи и доставки нет. Вопросы — администратору: +7 900 399-10-33.","k":""},{"q":"Как встретить Новый год в Ямал Парке?","a":"С 15 декабря по 10 января действуют новогодние цены. Ночь в куполе стоит 13 000 ₽, в домах «Волк» и «Медведь» — 15 000 ₽, бани — от 6 000 ₽ в час, банкетный зал — 70 000 ₽ за день. Новогодние ночи разбирают первыми, свободные даты смотрите на странице «Новый год».","k":""},{"q":"Сколько стоит вход в мини-зоопарк?","a":"Бесплатно: мини-зоопарк находится на территории комплекса.","k":"зоопарк платный бесплатно вход"},{"q":"Какие животные есть в мини-зоопарке?","a":"Две рыси, лисы и песец, два енота, кролики, две козы и косуля.","k":"какие зоопарк рыси лисы еноты кролики козы косуля звери"},{"q":"Когда работает мини-зоопарк?","a":"Мини-зоопарк открыт с 10:00 до 23:00.","k":""},{"q":"Что ещё есть для детей и отдыха?","a":"Детская площадка, пейнтбол и лазертаг, парковая зона с деревянными скульптурами.","k":"дети детьми ребенок поделать заняться развлечения"},{"q":"Где находится Ямал Парк?","a":"На 12-м км автодороги Салехард — Горнокнязевск, около 16 минут от центра Салехарда. Координаты для навигатора: 66.568040, 66.860055.","k":"адрес где находится расположение навигатор координаты карта далеко от города километров"},{"q":"Есть ли парковка?","a":"Да, парковка на 50 машин.","k":""},{"q":"Как добраться без машины?","a":"На такси от Салехарда, это около 16 минут.","k":"такси автобус маршрутка общественный транспорт добраться аэропорт вокзал без машины"},{"q":"Какие телефоны и контакты?","a":"+7 900 399-10-33, +7 34922 5-21-03, yamalpark89@yandex.ru, Telegram @yamalpark, VK vk.com/yamalpark, Max max.ru/id8901036776_biz.","k":"телефон позвонить контакты связаться администратор почта"},{"q":"Когда видно северное сияние?","a":"С сентября по апрель. С мая по август на Ямале белые ночи: небо слишком светлое, и сияние не видно. Чаще всего его видно с 22:00 до 02:00 по местному времени.","k":"сияние когда сезон месяц месяце лучше ехать поехать время года во сколько ночью время часы октябре"},{"q":"Можно ли гарантированно увидеть сияние?","a":"Гарантий не даёт никто: сияние зависит от Солнца и погоды. Но на широте Салехарда шансы высокие. Приезжайте на 2–3 ночи, чтобы поймать ясное небо. Прогноз на три ночи есть на странице «Северное сияние».","k":""},{"q":"Откуда лучше смотреть?","a":"За городом, в 12 км от Салехарда, небо темнее, и видно даже слабое сияние. В комплексе сияние видно со смотровой площадки и с террас домов «Волк» и «Медведь».","k":""},{"q":"Какое минимальное время аренды?","a":"Три часа. Бани работают с 10–11 до 23:00, продление после 23:00 — 7 000 ₽ в час.","k":"баня бани"},{"q":"Где есть Алиса и что она умеет?","a":"«Морошка», парная: дождь, вьюга, музыка, свет.<br>«Морошка», фито-сауна: фито, туман, музыка, вьюга, ветер.<br>«Брусника», парная: дождь, вьюга, туман, музыка, свет.<br>«Вьюга» — это подача пара на каменку.<br>В «Чернике» Алисы нет: дождь и ветер включаются кнопками на панели.","k":"баня бани"},{"q":"Как забронировать и отменить?","a":"Через форму на сайте, по телефону +7 900 399-10-33 или в сообщениях VK и Telegram (@yamalpark). После заявки пришлём подтверждение и реквизиты для предоплаты.<br>Отмена менее чем за 3 дня или неявка — предоплата не возвращается.","k":"баня бани"},{"q":"Можно с детьми?","a":"Да. На территории есть детская площадка и мини-зоопарк. Детям до 5 лет проживание бесплатно.","k":"проживание купол глэмпинг"},{"q":"На сколько бронируется дом?","a":"На весь день: с 12:00 до 22:00. Минимальный заказ — весь день.","k":"гриль гостевой дом"},{"q":"Сколько стоит?","a":"Гриль-дом №1 — 6 000 ₽ (вс–чт) и 8 000 ₽ (пт, сб, праздники). Гриль-дома №2 и №3 — 8 000 ₽ и 10 000 ₽. Гостевые дома №1 и №2 — 8 000 ₽ и 12 000 ₽. С 15 декабря по 10 января: гриль-дом №1 — 10 000 ₽, №2 и №3 — 12 000 ₽, гостевые дома — 15 000 ₽.","k":"гриль гостевой дом"},{"q":"Можно приехать с детьми?","a":"Да. На территории есть детская площадка и мини-зоопарк: рыси, лисы и песец, еноты, кролики, козы и косуля. Детям до 5 лет проживание и баня бесплатны.","k":""},{"q":"Работаете зимой? Будет ли северное сияние?","a":"Работаем круглый год. Сияние чаще всего видно с сентября по апрель в ясную погоду, лучше всего со смотровой площадки. В домиках тёплые полы, комфортно даже в −40 °C.","k":""},{"q":"Сколько всё стоит?","k":"цены прайс стоимость все цены","a":"Коротко о ценах:<br>• Купольный домик — 9 000 ₽ (вс–чт), 13 000 ₽ (пт–сб) за сутки.<br>• Дома «Волк» и «Медведь» — 8 000 ₽ (пн–чт), 12 000 ₽ (пт–вс).<br>• Бани — от 2 500 ₽ в час, минимум 3 часа.<br>• Гриль-дом №1 — 6 000 / 8 000 ₽, №2 и №3 — 8 000 / 10 000 ₽, гостевые дома — 8 000 / 12 000 ₽ за день.<br>• Чум — 12 000 / 15 000 ₽, шатёр «Сияние севера» — 10 000 / 15 000 ₽, банкетный зал — от 50 000 ₽.<br>С 15 декабря по 10 января действуют новогодние цены."},{"q":"Нужна ли предоплата?","k":"предоплата предоплату внести залог аванс оплатить заранее","a":"Да, бронь подтверждается п     var h = search(t)[0]; if(h && h.s >= 1.3) return {html:h.e.a, target:topicOf(h.e.q + " " + (h.e.k || "")), u:u};
    return null;
  }

  /* ---------- главный разбор вопроса ---------- */
  var BOOK_RE = /брон|заброн|свобод|(^|\s)заня|записат|запиш|снять|арендов|хочу|можно ли приехать|есть ли мест|есть мест|места есть|на дат|какие даты|когда можно/;
  var NOT_BOOK = /организац|юрлиц|документ|(^|\s)счет|договор|освобод|час(а|ов)? ночи|поздно|позже|пораньше|раньше|отмен|перенес|перенос|вернут|возврат|предоплат|как (за)?брон|как оформ|оплат|услови|правил|сертификат|подар/;
  function answer(text){
    goal("assistant_ask");
    var t = fix(text), t0 = norm(text);
    if(/^(привет|здравств|добр(ый|ое|ого) (день|утро|вечер)|доброго|хай|hello|hi)(s|$)/.test(t0) && t0.split(" ").length <= 4) return bot("Здравствуйте! Чем помочь? Подскажу цены и свободные даты и сразу открою бронирование.", START());
    if(/^(спасибо|благодар|ок|окей|понятно|ясно|хорошо|отлично|супер)/.test(t0) && t0.split(" ").length <= 4) return bot("Пожалуйста! Если удобно, подберу свободную дату прямо сейчас.", pivot(lastTarget()));
    if(/оператор|живой человек|живым человеком|с человеком|позови|позовите|администратор|позвоните мне|перезвон|обратн\S* звон|менеджер/.test(t) && !/до скольки|когда работает|во сколько|режим/.test(t)) return human();
    if(/^(привет|здравств|добр(ый|ое|ого) (день|утро|вечер)|доброго|хай|hello|hi)(\s|$)/.test(t) && t.split(" ").length <= 4) return bot("Здравствуйте! Чем помочь? Подскажу цены и свободные даты и сразу открою бронирование.", START());
    if(/^(спасибо|благодар|ок|окей|понятно|ясно|хорошо|отлично|супер)/.test(t) && t.split(" ").length <= 4) return bot("Пожалуйста! Если удобно, подберу свободную дату прямо сейчас.", pivot(lastTarget()));
    var parts = splitQ(text); if(parts.length === 1 && parts[0] !== t){ t = parts[0]; }
    if(parts.length > 1){
      var outs = [], tgt = null, inh = null, extra = [];
      parts.forEach(function(p){ var r = solve(p, inh); if(!r) return; if(r.u && r.u.objs.length) inh = r.u.objs; if(outs.indexOf(r.html) < 0) outs.push(r.html); tgt = tgt || r.target; extra = extra.concat(r.more || []);
        if(r.u){ if(r.u.objs[0]) state.obj = r.u.objs[0]; if(r.u.asp.length || r.u.am.length){ state.asp = r.u.asp; state.am = r.u.am; } } });
      if(outs.length > 1){ if(tgt) state.last = tgt; return bot(outs.join("<br><br>") + CTA, pivot(tgt || lastTarget(), extra.slice(0, 2))); }
    }
    var no = nope(t0) || nope(t);
    if(no){ var tp = topicOf(text); if(no[2] && !tp) state.last = no[2]; return bot("<b>Нет.</b> " + no[1] + CTA, pivot(tp || no[2] || lastTarget())); }
    var u = understand(t === t0 ? t : t + " " + t0);
    if(/сияни/.test(t) && /сегодн|сейчас|ночью|завтра|прогноз|будет|увид/.test(t) && !/гарант|месяц|когда|сезон|лучше/.test(t)) return liveAurora();
    if(/погод|температур|градус|сколько сейчас|какая сейчас/.test(t) && !u.objs.length && !/пар|бан|саун/.test(t)) return liveWeather();
    /* уточнение к прошлому вопросу: «а в «Медведе»?», «а на выходных?», «а сколько стоит?» */
    var follow = /^(а|и|ну|тогда|там|ещ[её]|а если|а для|а в|а на)(\s|$)/.test(t) || t.split(" ").length <= 3;
    if(follow){
      if(!u.objs.length && state.obj && (u.asp.length || u.am.length || u.date || u.people || u.hours || u.nights)) u.objs = [state.obj];
      if(!u.asp.length && !u.am.length && state.asp && (state.asp.length || state.am.length) && !BOOK_RE.test(t) && (u.objs.length || u.date || u.people || u.hours)){
        u.asp = state.asp.slice(); u.am = (state.am || []).slice(); if(!u.objs.length && state.obj) u.objs = [state.obj]; }
    }
    var factual = u.asp.length || u.am.length;
    var wantsBooking = (BOOK_RE.test(t) && !NOT_BOOK.test(t) && !factual) || (u.objs.length && u.date && !u.asp.length && !u.am.length && !u.people);
    if(/фотосесс|почасов|на пару час|на несколько час|на час(\s|$)|на 2 час/.test(t) && GROUPS.banya.indexOf(u.objs[0]) < 0 && u.objs[0] !== "@banya") wantsBooking = false;
    if(wantsBooking){
      if(u.date) state.date = u.date; state.nights = u.nights || null; state.people = u.people || null;
      var bu = u.objs.filter(function(o){ return o !== "zoo"; })[0] || (follow && state.obj !== "zoo" ? state.obj : null);
      if(bu){ state.obj = bu; state.last = bu; return pick(bu); }
      if(u.people && !u.date){ var rr = rec(u.people, modeOf(null, t)); return bot(rr.h + CTA, pivot(rr.t)); }
      return askUnit();
    }
    var f = compose(u, t);
    if(f){
      state.obj = u.objs[0] || f.target; state.asp = u.asp; state.am = u.am; state.last = f.target; if(u.date) state.date = u.date; state.nights = u.nights || null; state.people = u.people || null;
      return bot(f.html + CTA, pivot(f.target, f.more));
    }
    if(/связат|контакт|телефон|телеграм|ватсап|whatsapp|(^|\s)почт|написать вам|как вам написать/.test(t) && !u.objs.length) return bot(kbA("Какие телефоны и контакты?") + CTA, pivot(lastTarget()));
    if(/доставк/.test(t) && !/сертификат/.test(t)) return bot(kbA("Есть ли доставка еды?") + CTA, pivot(lastTarget()));
    if(/беседк/.test(t) && /зим|мороз|холод/.test(t)) return bot("Беседка — летняя. Зимой для компании подойдут гриль-дома (гриль прямо внутри), чум с обогревом или шатёр «Сияние севера» с дровяной печью." + CTA, pivot("@grill", [{t:"Забронировать: Чум", go:true, fn:function(){ pick("chum"); }}]));
    var topic = topicOf(text); if(topic) state.last = topic;
    var hits = search(t), top = hits[0];
    if(top && (!hits[1] || top.s > hits[1].s * 1.02 || top.s >= 1.6)){
      var more = []; hits.slice(1, 3).forEach(function(h){ if(h.s >= 1.5 && h.e.q !== top.e.q) more.push({t:h.e.q, fn:function(){ answer(h.e.q); }}); });
      if(!topic){ var tt = topicOf(top.e.q + " " + (top.e.k || "")); if(tt) state.last = tt; }
      if(u.objs.length) state.obj = u.objs[0]; state.asp = u.asp; state.am = u.am;
      return bot(top.e.a + CTA, pivot(topic || lastTarget(), more));
    }
    if(u.objs.length && u.objs[0] !== "zoo"){ state.obj = u.objs[0]; return compose({objs:[u.objs[0]], asp:["about"], am:[]}, t) ? bot("<b>" + NM[u.objs[0]] + "</b> — " + (ABOUT[u.objs[0]] || CAPG[u.objs[0]] || "") + "." + CTA, pivot(u.objs[0])) : pick(u.objs[0]); }
    if(u.asp.indexOf("price") >= 0){ var nyq = u.date && isNY(u.date); return bot(kbA(nyq ? "Как встретить Новый год в Ямал Парке?" : "Сколько всё стоит?") + CTA, pivot(lastTarget())); }
    if(u.date){ state.date = u.date; return askUnit(); }
    fallback();
  }

  /* ---------- открытие и закрытие ---------- */
  var greeted = false;
  function open(){
    panel.hidden = false; btn.setAttribute("aria-expanded", "true"); document.documentElement.classList.add("yp-as-open"); goal("assistant_open");
    if(YP.lenis && window.innerWidth <= 768) try{ YP.lenis.stop(); }catch(e){}
    if(!greeted){ greeted = true;
      if(!store.length) bot("Здравствуйте! Я помощник Ямал Парка. Расскажу про цены, бани, мини-зоопарк и северное сияние, найду свободную дату и открою бронирование. Что вас интересует?", START());
      else chips(START()); }
    setTimeout(function(){ if(window.innerWidth > 768) input.focus(); scroll(); }, 60);
    try{ sessionStorage.setItem("yp-as-open", "1"); }catch(e){}
  }
  function close(){
    panel.hidden = true; btn.setAttribute("aria-expanded", "false"); document.documentElement.classList.remove("yp-as-open");
    if(YP.lenis) try{ YP.lenis.start(); }catch(e){}
    try{ sessionStorage.removeItem("yp-as-open"); }catch(e){}
    btn.focus();
  }
  btn.addEventListener("click", open);
  root.querySelector(".yp-as__x").addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !panel.hidden) close(); });
  log.addEventListener("wheel", function(e){ e.stopPropagation(); }, {passive:true});
  log.addEventListener("touchmove", function(e){ e.stopPropagation(); }, {passive:true});
  form.addEventListener("submit", function(e){ e.preventDefault(); var v = input.value.trim(); if(!v) return; input.value = ""; msg("me", esc(v)); chips([]); answer(v); });
  /* ссылки «/страница» внутри ответов: на телефоне закрываем окно, чтобы было видно, куда перешли */
  log.addEventListener("click", function(e){ var a = e.target.closest("a[href^='/'],a[href^='#']"); if(a && window.innerWidth <= 768) close(); });
  /* другие кнопки сайта могут открыть помощника: <a href="#assistant"> или data-yp-assist */
  document.addEventListener("click", function(e){ var a = e.target.closest && e.target.closest('a[href="#assistant"],[data-yp-assist]'); if(!a) return; e.preventDefault(); open(); });
  /* восстановить разговор в пределах вкладки */
  try{ var s = JSON.parse(sessionStorage.getItem("yp-as") || "null"); if(s && s.log) s.log.forEach(function(m){ store.push(m); msg(m.w, m.h, false); });
    if(sessionStorage.getItem("yp-as-open") === "1" && window.innerWidth > 768) open(); }catch(e){}
  YP.assistant = {open:open, close:close, ask:function(q){ open(); msg("me", esc(q)); chips([]); answer(q); }};
})();
</script>
