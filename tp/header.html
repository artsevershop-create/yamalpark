<!-- 01 · Шапка: единственный логотип на странице (треугольники SVG + надпись из брендбука). Над ночными секциями — белая надпись -->
<style>
.yp.yp-hdr{position:fixed;top:0;left:0;right:0;z-index:9990;background:transparent;padding-top:env(safe-area-inset-top,0px);transition:background .4s,box-shadow .4s,color .4s}
.yp.yp-hdr.is-solid{background:rgba(243,244,241,.78);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:0 1px 0 var(--yp-line)}
.yp.yp-hdr.is-dark{color:#fff}
.yp.yp-hdr.is-dark.is-solid{background:rgba(11,19,32,.6);box-shadow:0 1px 0 rgba(255,255,255,.1)}
.yp.yp-hdr.is-open{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.yp-hdr__in{display:flex;align-items:center;gap:28px;height:80px}
.yp-logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
.yp-logo svg{width:52px;height:22px;overflow:visible}
.yp-logo svg polygon{transform-box:fill-box;transform-origin:50% 50%;transition:transform .6s var(--yp-ease)}
.yp-logo:hover svg polygon:nth-child(1){transform:translateY(-3px) rotate(-12deg)}
.yp-logo:hover svg polygon:nth-child(2){transform:translateY(3px) rotate(180deg)}
.yp-logo:hover svg polygon:nth-child(3){transform:translateY(-3px) rotate(12deg)}
.yp-logo img{height:17px;width:auto}
.yp-logo .w-white{display:none}
.yp-hdr.is-dark .yp-logo .w-color{display:none}
.yp-hdr.is-dark .yp-logo .w-white{display:block}
.yp-nav{display:flex;gap:0;margin-left:auto}
.yp-nav a{position:relative;text-decoration:none;font-size:14.5px;font-weight:500;padding:10px 11px;white-space:nowrap;border-radius:999px;transition:background .25s}
.yp-nav a::after{content:"";position:absolute;left:50%;bottom:4px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--c);transform:translate(-50%,6px);opacity:0;transition:transform .3s var(--yp-ease),opacity .3s}
.yp-nav a:hover::after{transform:translate(-50%,0);opacity:1}
.yp-hdr__tel{font:500 14px var(--yp-mono);text-decoration:none;white-space:nowrap}
.yp-hdr .yp-btn{padding:13px 22px;font-size:14px}
.yp-hdr.is-dark .yp-btn{background:#fff;color:var(--yp-ink)}
.yp-hdr.is-dark .yp-btn:hover{color:#fff}
.yp-burger{display:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--yp-ink);color:#fff;cursor:pointer;margin-left:auto;position:relative}
.yp-burger span,.yp-burger::before,.yp-burger::after{content:"";position:absolute;left:14px;right:14px;height:1.5px;background:currentColor;transition:transform .35s var(--yp-ease),opacity .3s}
.yp-burger::before{top:17px}.yp-burger span{top:22px}.yp-burger::after{top:27px}
.yp-hdr.is-open .yp-burger::before{transform:translateY(5px) rotate(45deg)}
.yp-hdr.is-open .yp-burger span{opacity:0}
.yp-hdr.is-open .yp-burger::after{transform:translateY(-5px) rotate(-45deg)}
.yp-menu{position:fixed;inset:0;z-index:-1;background:var(--yp-bg);color:var(--yp-ink);padding:calc(110px + env(safe-area-inset-top,0px)) var(--yp-gutter) 32px;display:flex;flex-direction:column;gap:4px;clip-path:circle(0% at calc(100% - 40px) 40px);transition:clip-path .7s var(--yp-ease);visibility:hidden}
.yp-hdr.is-open .yp-menu{clip-path:circle(150% at calc(100% - 40px) 40px);visibility:visible}
.yp-menu a{display:flex;align-items:center;gap:14px;font:300 26px/1.35 var(--yp-fd);letter-spacing:-.02em;text-decoration:none}
.yp-menu a i{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid var(--c)}
.yp-menu .yp-hdr__tel{font:500 18px var(--yp-mono);margin-top:auto}
.yp-menu .yp-btn{margin-top:14px;align-self:flex-start}
.yp-hdr.is-open .yp-logo .w-color{display:block}.yp-hdr.is-open .yp-logo .w-white{display:none}
/* звонок: значок трубки, когда номер в шапке не помещается */
.yp-hdr__call{display:none;flex:0 0 auto;width:44px;height:44px;border-radius:50%;place-items:center;text-decoration:none;box-shadow:inset 0 0 0 1px var(--yp-line);transition:background .25s}
.yp-hdr.is-dark .yp-hdr__call{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.yp-hdr__call:hover{background:rgba(127,127,127,.12)}
.yp-hdr__call svg{width:18px;height:18px}
.yp-hdr__in>.yp-hdr__call{display:grid}
/* переключатель языков */
.yp-lang{display:flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--yp-line);flex:0 0 auto}
.yp-hdr.is-dark .yp-lang{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.yp-lang a{font:600 12px/1 var(--yp-mono);letter-spacing:.04em;text-decoration:none;padding:8px 9px;border-radius:999px;opacity:.62;transition:opacity .25s,background .25s,color .25s}
.yp-lang a:hover{opacity:1}
.yp-lang a.is-on{opacity:1;background:var(--yp-ink);color:#fff}
.yp-hdr.is-dark .yp-lang a.is-on{background:#fff;color:var(--yp-ink)}
.yp-menu .yp-lang{align-self:flex-start;margin-top:18px}
.yp-menu .yp-lang a{font-size:14px;padding:11px 14px}
@media (max-width:1320px){.yp-hdr__in>.yp-hdr__call{margin-left:auto}.yp-hdr__in>.yp-hdr__call+.yp-btn+.yp-lang{margin-left:0}.yp-hdr__in>.yp-lang{margin-left:auto}.yp-hdr__in>.yp-lang+.yp-burger{margin-left:0}}
@media (max-width:420px){.yp-hdr__in>.yp-lang{display:none}}
.yp-hdr__in>.yp-hdr__tel{display:none}
.yp-hdr__in>.yp-btn{flex:0 0 auto}
.yp-hdr__in{gap:16px}.yp-nav a{padding:10px 8px}
@media (max-width:1320px){.yp-nav,.yp-hdr__in>.yp-btn{display:none}.yp-burger{display:block}}
@media (min-width:1321px){.yp-menu{display:none}}
</style>

<script>
(function(){
  var h = document.getElementById("yp-hdr"); if(!h) return;
  var burger = h.querySelector(".yp-burger");
  function solid(){ h.classList.toggle("is-solid", window.scrollY > 30); }
  window.addEventListener("scroll", solid, {passive:true}); solid();
  function close(){ h.classList.remove("is-open"); burger.setAttribute("aria-expanded","false"); if(window.YP && YP.lenis) YP.lenis.start(); document.documentElement.style.overflow=""; }
  burger.addEventListener("click", function(){
    var open = !h.classList.contains("is-open");
    h.classList.toggle("is-open", open); burger.setAttribute("aria-expanded", String(open));
    if(window.YP && YP.lenis){ open ? YP.lenis.stop() : YP.lenis.start(); }
    document.documentElement.style.overflow = open ? "hidden" : "";
  });
  h.querySelectorAll(".yp-menu a").forEach(function(a){ a.addEventListener("click", close); });
  document.addEventListener("yp:menu-close", close);
  /* тёмный режим шапки над секциями с data-yp-theme="dark" */
  function checkDark(){
    var dark = false;
    document.querySelectorAll('[data-yp-theme="dark"]').forEach(function(s){ var r = s.getBoundingClientRect(); if(r.top <= 40 && r.bottom >= 40) dark = true; });
    h.classList.toggle("is-dark", dark);
  }
  window.addEventListener("scroll", checkDark, {passive:true}); window.addEventListener("resize", checkDark);
  document.addEventListener("yp:theme", checkDark); checkDark();
  document.addEventListener("DOMContentLoaded", checkDark); window.addEventListener("load", checkDark);
  /* переключатель языков: ссылка на эту же страницу на другом языке */
  function langLinks(){
    h.querySelectorAll(".yp-lang a").forEach(function(a){
      var to = a.getAttribute("data-yp-to"); a.classList.toggle("is-on", to === (YP.lang || "ru"));
      if(YP.langHref) a.setAttribute("href", YP.langHref(YP.selfHref(), to));
    });
  }
  langLinks(); window.addEventListener("hashchange", langLinks);
})();
</script>
