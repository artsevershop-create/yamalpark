<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как забронировать?","acceptedAnswer":{"@type":"Answer","text":"Проживание бронируется на сайте с мгновенным подтверждением. Бани, гриль-дома, беседку, чум, шатёр и банкетный зал можно записать онлайн по времени. Если удобнее, позвоните по номеру +7 900 399-10-33 или напишите в VK, Telegram (@yamalpark) или Max. После заявки пришлём подтверждение и реквизиты для предоплаты."}},{"@type":"Question","name":"Как узнать, есть ли свободные даты?","acceptedAnswer":{"@type":"Answer","text":"Свободные даты и цены на сайте берутся прямо из систем бронирования: на страницах «Глэмпинг», «Бани» и «Гриль-дома» есть календарь. Если нужной даты нет, позвоните администратору: +7 900 399-10-33."}},{"@type":"Question","name":"Какие условия отмены?","acceptedAnswer":{"@type":"Answer","text":"Отмена менее чем за 3 дня или неявка: предоплата не возвращается. Полные условия есть в разделе «Документы»."}},{"@type":"Question","name":"Можно ли оформить бронь на организацию?","acceptedAnswer":{"@type":"Answer","text":"Да. Для организаций оформляем договор и предоплату. Подробности согласует администратор: +7 900 399-10-33."}},{"@type":"Question","name":"Чем можно оплатить?","acceptedAnswer":{"@type":"Answer","text":"Картой или через СБП."}},{"@type":"Question","name":"Можно ли с домашними животными?","acceptedAnswer":{"@type":"Answer","text":"Да, с домашними животными можно."}},{"@type":"Question","name":"Можно ли привозить свои продукты и напитки?","acceptedAnswer":{"@type":"Answer","text":"Да, свои продукты и напитки можно привозить."}},{"@type":"Question","name":"Где можно курить?","acceptedAnswer":{"@type":"Answer","text":"Курить можно на улице возле урн."}},{"@type":"Question","name":"Работает ли комплекс зимой?","acceptedAnswer":{"@type":"Answer","text":"Да, Ямал Парк работает круглый год."}},{"@type":"Question","name":"Какие варианты проживания есть?","acceptedAnswer":{"@type":"Answer","text":"Купольный домик (30 м², 2–4 гостя) и два дома с террасой: «Волк» и «Медведь» (по 50 м², 2–4 гостя). В «Волке» и «Медведе» есть кухня, душ, спальня с кроватью 160×200 и раскладной диван."}},{"@type":"Question","name":"Во сколько заезд и выезд?","acceptedAnswer":{"@type":"Answer","text":"Купол: заезд с 14:00, выезд до 12:00 следующего дня. «Волк» и «Медведь»: заезд с 15:00, выезд до 13:00. Ранний заезд и поздний выезд возможны по договорённости, если объект свободен. Продление в день выезда: 1 000 ₽ в час."}},{"@type":"Question","name":"Сколько стоит проживание?","acceptedAnswer":{"@type":"Answer","text":"Купольный домик: 9 000 ₽ за сутки с воскресенья по четверг и 13 000 ₽ в пятницу и субботу. Дома «Волк» и «Медведь»: 8 000 ₽ с понедельника по четверг и 12 000 ₽ с пятницы по воскресенье. С 15 декабря по 10 января действуют новогодние цены: купол 13 000 ₽, «Волк» и «Медведь» 15 000 ₽ за ночь."}},{"@type":"Question","name":"Не холодно ли зимой?","acceptedAnswer":{"@type":"Answer","text":"Нет. В домиках тёплые полы, комфортно даже при −40 °C."}},{"@type":"Question","name":"Есть ли Wi-Fi?","acceptedAnswer":{"@type":"Answer","text":"Да, бесплатный Wi-Fi работает в большинстве домиков, банях и на основной территории. В отдалённых точках сигнал может быть слабее."}},{"@type":"Question","name":"Можно ли с детьми?","acceptedAnswer":{"@type":"Answer","text":"Да. На территории есть детская площадка и мини-зоопарк. Детям до 5 лет проживание и баня бесплатны."}},{"@type":"Question","name":"Можно ли пожарить мясо у дома?","acceptedAnswer":{"@type":"Answer","text":"Да, у домов «Волк» и «Медведь» есть мангальная зона, она бесплатная."}},{"@type":"Question","name":"Какое минимальное время аренды бани?","acceptedAnswer":{"@type":"Answer","text":"Три часа. Бани работают с 10–11 до 23:00, продление после 23:00 стоит 7 000 ₽ в час."}},{"@type":"Question","name":"Сколько стоит баня?","acceptedAnswer":{"@type":"Answer","text":"Цена за час: в понедельник–среду до 14:00 — 2 500 ₽, после 14:00 — 3 500 ₽. С четверга по воскресенье — 5 000 ₽, «Черника» — 4 000 ₽. С 15 декабря по 10 января: «Морошка» и «Брусника» 6 000 ₽ в час, «Черника» 5 000 ₽."}},{"@type":"Question","name":"Сколько человек помещается в баню?","acceptedAnswer":{"@type":"Answer","text":"«Морошка» и «Брусника» — до 10 гостей, «Черника» — до 8."}},{"@type":"Question","name":"Что входит в стоимость?","acceptedAnswer":{"@type":"Answer","text":"Парная, термопот, посуда, телевизор, Wi-Fi, холодильник, посудомоечная машина, санузел, душ и раздевалка. Полотенца, простыни, халаты, веники, напитки, закуски и PS5 заказываются отдельно."}},{"@type":"Question","name":"Сколько стоят допы?","acceptedAnswer":{"@type":"Answer","text":"Аренда полотенец — 400 ₽, простыней — 300 ₽, халата — 1 000 ₽. Веник дубовый или берёзовый — 600 ₽, пучок мяты или полыни — 175 ₽, донника — 150 ₽. Банная шапка — 400 ₽, тапочки — 650 ₽. PlayStation 5 — 3 000 ₽. Напитки: Coca-Cola 0,33 л — 300 ₽, Borjomi 0,5 л — 220 ₽, Evian 0,5 л — 185 ₽."}},{"@type":"Question","name":"Как работает Алиса в бане?","acceptedAnswer":{"@type":"Answer","text":"В парных «Морошки» и «Брусники» скажите «Алиса, включи дождь», «вьюгу», «музыку» или «свет». В «Бруснике» есть ещё туман. В фито-сауне «Морошки»: фито, туман, музыка, вьюга и ветер. «Вьюга» — подача пара на каменку. В «Чернике» Алисы нет: дождь и ветер включаются кнопками на панели."}},{"@type":"Question","name":"Чем отличаются бани?","acceptedAnswer":{"@type":"Answer","text":"«Морошка»: парная и аромасауна. «Брусника»: парная и хаммам. «Черника»: баня на дровах с живым жаром."}},{"@type":"Question","name":"Можно ли с детьми?","acceptedAnswer":{"@type":"Answer","text":"Да. Детям до 5 лет посещение бани бесплатно."}},{"@type":"Question","name":"На сколько бронируется гриль-дом?","acceptedAnswer":{"@type":"Answer","text":"На весь день: с 12:00 до 22:00. Минимальный заказ — весь день."}},{"@type":"Question","name":"Сколько стоят гриль-дома и гостевые дома?","acceptedAnswer":{"@type":"Answer","text":"Гриль-дом №1: 6 000 ₽ (вс–чт) и 8 000 ₽ (пт, сб, праздники). Гриль-дома №2 и №3: 8 000 ₽ и 10 000 ₽. Гостевые дома №1 и №2: 8 000 ₽ и 12 000 ₽. С 15 декабря по 10 января: гриль-дом №1 — 10 000 ₽, №2 и №3 — 12 000 ₽, гостевые дома — 15 000 ₽."}},{"@type":"Question","name":"Сколько человек помещается?","acceptedAnswer":{"@type":"Answer","text":"Гриль-дома — 15–20 гостей, гостевые дома — 20–25. Для больших компаний есть банкетный зал на 100–150 человек."}},{"@type":"Question","name":"Что есть внутри?","acceptedAnswer":{"@type":"Answer","text":"В гриль-домах: гриль-установка, лавки и столешница вокруг гриля, телевизор, микроволновка, умывальник. В гостевых домах: стол и 4 лавки, телевизор, микроволновка, холодильник, умывальник и шкаф. Гриль-зона у гостевых домов в отдельном здании рядом."}},{"@type":"Question","name":"Что такое летняя беседка?","acceptedAnswer":{"@type":"Answer","text":"Беседка на территории комплекса для компании до 15 гостей. Аренда с 12:00 до 22:00, 6 000 ₽ за день. В стоимость входят одноразовая посуда, розжиг и решётка."}},{"@type":"Question","name":"Сколько стоит аренда чума?","acceptedAnswer":{"@type":"Answer","text":"12 000 ₽ с понедельника по четверг и 15 000 ₽ с пятницы по воскресенье. В стоимость входят обогретый чум, терраса, костровище, казан и мангальная зона. Чум рассчитан на 15–20 гостей и работает круглый год."}},{"@type":"Question","name":"Сколько стоит шатёр «Сияние севера»?","acceptedAnswer":{"@type":"Answer","text":"10 000 ₽ в будни и воскресенье, 15 000 ₽ в пятницу, субботу и праздники. Шатёр 40 м² с панорамным окном и дровяной печью, до 20 гостей, весь день с 12:00 до 23:00. После 23:00 каждый час стоит 3 000 ₽."}},{"@type":"Question","name":"Сколько стоит банкетный зал?","acceptedAnswer":{"@type":"Answer","text":"50 000 ₽ с понедельника по четверг и в воскресенье, 70 000 ₽ в пятницу, субботу, праздники и с 15 декабря по 10 января. Аренда на весь день, с 12:00 до 23:00. Зал рассчитан на 100–150 гостей."}},{"@type":"Question","name":"Можно ли заказать меню и программу?","acceptedAnswer":{"@type":"Answer","text":"Банкетное меню и программу обсудите с администратором: +7 900 399-10-33. Он подберёт площадку под ваш праздник."}},{"@type":"Question","name":"Можно ли провести корпоратив?","acceptedAnswer":{"@type":"Answer","text":"Да. Для компаний есть банкетный зал, шатёр, гриль-дома, гостевые дома и чум, а после праздника можно продолжить вечер в бане. Примеры праздника с расчётом смотрите на странице «Корпоративы»."}},{"@type":"Question","name":"Есть ли подарочные сертификаты?","acceptedAnswer":{"@type":"Answer","text":"Да: на ночь в куполе, баню, вечер в чуме, день в гриль-доме или на любую сумму (5 000, 10 000, 15 000, 20 000 ₽ и другая). Набор «Вечер на Полярном круге»: ночь в куполе и баня на 3 часа от 16 500 ₽. Получатель сам выберет дату."}},{"@type":"Question","name":"Как оформить сертификат?","acceptedAnswer":{"@type":"Answer","text":"Позвоните по номеру +7 900 399-10-33 или закажите обратный звонок на сайте. Администратор оформит сертификат на имя получателя и подскажет, как оплатить."}},{"@type":"Question","name":"Как встретить Новый год в Ямал Парке?","acceptedAnswer":{"@type":"Answer","text":"С 15 декабря по 10 января действуют новогодние цены. Ночь в куполе стоит 13 000 ₽, в домах «Волк» и «Медведь» — 15 000 ₽, бани — от 6 000 ₽ в час, банкетный зал — 70 000 ₽ за день. Новогодние ночи разбирают первыми, свободные даты смотрите на странице «Новый год»."}},{"@type":"Question","name":"Сколько стоит вход в мини-зоопарк?","acceptedAnswer":{"@type":"Answer","text":"Бесплатно: мини-зоопарк находится на территории комплекса."}},{"@type":"Question","name":"Какие животные есть в мини-зоопарке?","acceptedAnswer":{"@type":"Answer","text":"Две рыси, лисы и песец, два енота, кролики, две козы и косуля."}},{"@type":"Question","name":"Когда работает мини-зоопарк?","acceptedAnswer":{"@type":"Answer","text":"Мини-зоопарк открыт с 10:00 до 23:00."}},{"@type":"Question","name":"Что ещё есть для детей и отдыха?","acceptedAnswer":{"@type":"Answer","text":"Детская площадка, пейнтбол и лазертаг, парковая зона с деревянными скульптурами."}},{"@type":"Question","name":"Где находится Ямал Парк?","acceptedAnswer":{"@type":"Answer","text":"На 12-м км автодороги Салехард — Горнокнязевск, около 16 минут от центра Салехарда. Координаты для навигатора: 66.568040, 66.860055."}},{"@type":"Question","name":"Есть ли парковка?","acceptedAnswer":{"@type":"Answer","text":"Да, парковка на 50 машин."}},{"@type":"Question","name":"Как добраться без машины?","acceptedAnswer":{"@type":"Answer","text":"На такси от Салехарда, это около 16 минут."}},{"@type":"Question","name":"Какие телефоны и контакты?","acceptedAnswer":{"@type":"Answer","text":"+7 900 399-10-33, +7 34922 5-21-03, yamalpark89@yandex.ru, Telegram @yamalpark, VK vk.com/yamalpark, Max max.ru/id8901036776_biz."}},{"@type":"Question","name":"Когда видно северное сияние?","acceptedAnswer":{"@type":"Answer","text":"С сентября по апрель. С мая по август на Ямале белые ночи: небо слишком светлое, и сияние не видно. Чаще всего его видно с 22:00 до 02:00 по местному времени."}},{"@type":"Question","name":"Можно ли гарантированно увидеть сияние?","acceptedAnswer":{"@type":"Answer","text":"Гарантий не даёт никто: сияние зависит от Солнца и погоды. Но на широте Салехарда шансы высокие. Приезжайте на 2–3 ночи, чтобы поймать ясное небо. Прогноз на три ночи есть на странице «Северное сияние»."}},{"@type":"Question","name":"Откуда лучше смотреть?","acceptedAnswer":{"@type":"Answer","text":"За городом, в 12 км от Салехарда, небо темнее, и видно даже слабое сияние. В комплексе сияние видно со смотровой площадки и с террас домов «Волк» и «Медведь»."}}]}</script>
