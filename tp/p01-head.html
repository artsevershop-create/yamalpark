<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Во сколько заезд и выезд?","acceptedAnswer":{"@type":"Answer","text":"Купол: заезд с 14:00, выезд до 12:00 следующего дня. Дома «Волк» и «Медведь»: заезд с 15:00, выезд до 13:00. Ранний заезд и поздний выезд возможны по договорённости, если объект свободен."}},{"@type":"Question","name":"Сколько стоит баня?","acceptedAnswer":{"@type":"Answer","text":"Цена за час: в понедельник–среду до 14:00 — 2 500 ₽, после 14:00 — 3 500 ₽; с четверга по воскресенье — 5 000 ₽ («Черника» — 4 000 ₽). После 23:00 — 7 000 ₽. Минимальная аренда — 3 часа."}},{"@type":"Question","name":"Как работает Алиса в бане?","acceptedAnswer":{"@type":"Answer","text":"В парных «Морошки» и «Брусники» скажите «Алиса, включи дождь», «вьюгу», «музыку» или «свет». В «Бруснике» есть ещё туман. В фито-сауне «Морошки»: фито, туман, музыка, вьюга и ветер. «Вьюга» — это подача пара на каменку. В «Чернике» Алисы нет: дождь и ветер включаются кнопками на панели."}},{"@type":"Question","name":"Можно приехать с детьми?","acceptedAnswer":{"@type":"Answer","text":"Да. На территории есть детская площадка и мини-зоопарк: рыси, лисы и песец, кролики, козы и косуля. Детям до 5 лет проживание и баня обычно бесплатны, уточняйте при бронировании."}},{"@type":"Question","name":"Работаете зимой? Будет ли северное сияние?","acceptedAnswer":{"@type":"Answer","text":"Работаем круглый год. Сияние чаще всего видно с сентября по апрель в ясную погоду, лучше всего со смотровой площадки. В домиках тёплые полы, комфортно даже в −40 °C."}},{"@type":"Question","name":"Какие условия отмены?","acceptedAnswer":{"@type":"Answer","text":"Отмена за 7 дней и раньше: возврат 100% предоплаты. Отмена менее чем за 3 дня или неявка: предоплата не возвращается. Полные условия в разделе «Документы»."}}]}</script>
