<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Когда в Салехарде сезон северного сияния?","acceptedAnswer":{"@type":"Answer","text":"С сентября по апрель. С мая по август на Ямале белые ночи: небо слишком светлое, и сияние не видно, даже если оно есть."}},{"@type":"Question","name":"Во сколько лучше смотреть сияние?","acceptedAnswer":{"@type":"Answer","text":"Чаще всего с 22:00 до 02:00 по местному времени. Точное лучшее время на каждую ночь показываем в прогнозе выше — по индексу Kp и облачности."}},{"@type":"Question","name":"Можно ли гарантированно увидеть сияние?","acceptedAnswer":{"@type":"Answer","text":"Гарантий не даёт никто: сияние зависит от Солнца и погоды. Но на широте Салехарда шансы высокие — в ясную ночь сезона сияние видно часто. Приезжайте на 2–3 ночи, чтобы поймать ясное небо."}},{"@type":"Question","name":"Видно ли сияние в самом Салехарде?","acceptedAnswer":{"@type":"Answer","text":"Яркое сияние видно и из города, но фонари и подсветка мешают. За городом, в 12 км от Салехарда, небо темнее, и видно даже слабое сияние."}},{"@type":"Question","name":"Что такое индекс Kp?","acceptedAnswer":{"@type":"Answer","text":"Это шкала геомагнитной активности от 0 до 9. Чем выше Kp, тем ярче и шире сияние. Для Салехарда хватает Kp 2–3, при Kp 5 и выше сияние может закрывать всё небо."}},{"@type":"Question","name":"Что делать, если ночь облачная?","acceptedAnswer":{"@type":"Answer","text":"Попариться в бане с Алисой, посидеть в гриль-доме или у костра в чуме. Облака часто расходятся за пару часов — следите за прогнозом облачности по часам."}}]}</script>
